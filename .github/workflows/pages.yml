name: Publish Maya
on:
  push:
    branches: [main]
    paths: [maya-site.zip, .github/workflows/pages.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Unpack reviewed static frontend
        run: |
          python3 -m zipfile -e maya-site.zip _site
          python3 - <<'PY'
          from pathlib import Path
          p=Path('_site/mayanin-zaman-kapsulu/media-sw.js')
          s=p.read_text()
          if "'Content-Security-Policy':'sandbox'" not in s:
              s=s.replace("'X-Content-Type-Options':'nosniff'", "'X-Content-Type-Options':'nosniff','Content-Security-Policy':'sandbox'")
          p.write_text(s)
          PY
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
